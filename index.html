<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal C Execution Visualizer (Browser Prototype)</title>
    <style>
        :root {
            --bg-dark: #181825;
            --panel-bg: #1e1e2e;
            --surface: #313244;
            --text-main: #cdd6f4;
            --accent: #cba6f7;
            --green: #a6e3a1;
            --yellow: #f9e2af;
            --cyan: #89dceb;
            --red: #f38ba8;
            --active-line: #45475a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1350px;
            margin: 0 auto;
        }
        
        /* Top Navbar */
        header {
            background: var(--panel-bg);
            padding: 12px 18px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid var(--surface);
        }
        .brand {
            font-size: 18px;
            font-weight: bold;
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-settings {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        input, select, textarea {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--surface);
            border-radius: 5px;
            padding: 7px 10px;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: 1px solid var(--accent);
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            background: var(--accent);
            color: #11111b;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 14px;
        }
        button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background: var(--surface); color: #6c7086; cursor: not-allowed; }
        .btn-run { background: var(--green); }
        
        /* Status & Explanation Bar */
        .status-bar {
            background: #26283e;
            border-left: 5px solid var(--yellow);
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            min-height: 52px;
        }
        .step-badge {
            background: var(--bg-dark);
            color: var(--cyan);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
        }

        /* Main Workspace Grid */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1.15fr 1fr;
            gap: 16px;
            align-items: start;
        }
        @media (max-width: 1050px) {
            .workspace { grid-template-columns: 1fr; }
        }
        .panel {
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 14px;
            border: 1px solid var(--surface);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--surface);
            padding-bottom: 8px;
        }
        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--cyan);
            font-weight: bold;
        }

        /* Editor Column */
        #codeEditor {
            width: 100%;
            height: 330px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        #stdinInput {
            width: 100%;
            font-family: monospace;
        }

        /* Visualizer Code View */
        .code-view {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.55;
            background: var(--bg-dark);
            padding: 10px 0;
            border-radius: 6px;
            min-height: 390px;
            max-height: 480px;
            overflow-y: auto;
        }
        .code-line {
            display: flex;
            padding: 2px 10px;
            border-left: 4px solid transparent;
        }
        .code-line.active {
            background: var(--active-line);
            border-left-color: var(--green);
            font-weight: bold;
        }
        .line-num {
            width: 32px;
            color: #6c7086;
            user-select: none;
            text-align: right;
            padding-right: 12px;
        }
        .line-text { white-space: pre; }

        /* Call Stack & Memory */
        .stack-box {
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            min-height: 240px;
            max-height: 340px;
            overflow-y: auto;
            background: var(--bg-dark);
            padding: 12px;
            border-radius: 6px;
        }
        .stack-frame {
            background: #27273a;
            border: 2px solid #585b70;
            border-radius: 6px;
            padding: 10px 12px;
        }
        .stack-frame.active-frame {
            border-color: var(--green);
            background: #233138;
        }
        .frame-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 14px;
        }
        .frame-func { color: var(--yellow); font-weight: bold; }
        .frame-status { font-size: 11px; color: #a6adc8; }
        .vars-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .var-chip {
            background: var(--bg-dark);
            border: 1px solid #45475a;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .var-name { color: var(--cyan); }
        .var-val { color: var(--green); font-weight: bold; }

        /* Terminal Output */
        .terminal {
            background: #0b0b11;
            color: var(--green);
            font-family: 'Consolas', monospace;
            font-size: 16px;
            padding: 12px;
            border-radius: 6px;
            min-height: 80px;
            white-space: pre-wrap;
            border: 1px solid #313244;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--green);
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        .helper-link {
            color: var(--accent);
            font-size: 12px;
            text-decoration: none;
        }
        .helper-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>⚙️ C Visualizer Studio</span>
            <select id="presetSelect" onchange="loadPreset()">
                <option value="recursion">Preset 1: Reverse Input (Recursion)</option>
                <option value="loop">Preset 2: Sum of Array (For Loop)</option>
                <option value="factorial">Preset 3: Factorial Calculator</option>
            </select>
        </div>

        <div class="top-settings">
            <input type="password" id="apiKey" placeholder="Paste Gemini API Key (for custom code)" style="width: 250px;">
            <a class="helper-link" href="https://aistudio.google.com/app/apikey" target="_blank">Get Free Key ↗</a>
            <button class="btn-run" id="btnCompile" onclick="compileAndVisualize()">⚡ Compile & Visualize</button>
        </div>
    </header>

    <div class="status-bar">
        <div id="explanationText">Ready! Select a preset or edit the C code on the left, then click <strong>Compile & Visualize</strong>.</div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <button id="btnPrev" onclick="prevStep()" disabled>⏮ Prev</button>
            <button id="btnPlay" onclick="togglePlay()" disabled>▶ Play</button>
            <button id="btnNext" onclick="nextStep()" disabled>Next ⏭</button>
            <span class="step-badge" id="stepCounter">Step 0 / 0</span>
        </div>
    </div>

    <div class="workspace">
        <!-- Column 1: Code & Input Editor -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">1. Write or Paste Any C Code</span>
            </div>
            <textarea id="codeEditor" spellcheck="false"></textarea>
            
            <div class="panel-header" style="margin-top: 6px;">
                <span class="panel-title">Standard Input (stdin)</span>
            </div>
            <input type="text" id="stdinInput" value="cat" placeholder="Type program input here...">
        </div>

        <!-- Column 2: Live Line-by-Line Execution -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">2. Line-by-Line Execution Trace</span>
            </div>
            <div class="code-view" id="codeView"></div>
        </div>

        <!-- Column 3: Memory & Output -->
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">3. Call Stack & Local Variables (↑)</span>
                </div>
                <div class="stack-box" id="stackBox"></div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">4. Console Output (stdout)</span>
                </div>
                <div class="terminal"><span id="stdoutBox"></span><span class="cursor"></span></div>
            </div>
        </div>
    </div>

<script>
    // Dynamic offline trace generator for the Recursion preset so custom stdin works immediately!
    function buildRecursionTrace(inputStr) {
        const trace = [
            { line: 13, explanation: "Program execution starts in main().", stdout: "", stack: [{ func: "main()", status: "Active", vars: {} }] },
            { line: 14, explanation: "main() calls fx() for the first time.", stdout: "", stack: [{ func: "main()", status: "Active", vars: {} }] }
        ];
        const chars = inputStr.split('').concat(['\n']);
        let idx = 0, out = "";
        let stack = [{ func: "main()", status: "Paused", vars: {} }];
        const clone = () => JSON.parse(JSON.stringify(stack));

        function sim(depth) {
            stack.push({ func: `fx() #${depth}`, status: "Active", vars: { a: "'?'" } });
            trace.push({ line: 3, explanation: `Entered fx() #${depth}. A new stack frame is created.`, stdout: out, stack: clone() });

            const ch = chars[idx++];
            const disp = ch === '\n' ? "'\\n'" : `'${ch}'`;
            stack[stack.length - 1].vars.a = disp;

            if (ch !== '\n') {
                trace.push({ line: 5, explanation: `getchar() reads ${disp} from stdin and assigns it to 'a'. Since ${disp} != '\\n' is True, we enter the if-block.`, stdout: out, stack: clone() });
                trace.push({ line: 6, explanation: `fx() #${depth} calls fx() #${depth + 1} recursively.`, stdout: out, stack: clone() });
                stack[stack.length - 1].status = "Paused";
                sim(depth + 1);
                stack[stack.length - 1].status = "Active";
            } else {
                trace.push({ line: 5, explanation: `getchar() reads '\\n' (end of input). Condition ('\\n' != '\\n') is FALSE! Recursion stops.`, stdout: out, stack: clone() });
            }

            if (ch !== '\n') {
                out += ch;
                trace.push({ line: 9, explanation: `In fx() #${depth}, 'a' is ${disp}. putchar(${disp}) prints '${ch}' to stdout!`, stdout: out, stack: clone() });
            } else {
                trace.push({ line: 8, explanation: `In fx() #${depth}, 'a' is '\\n', so (a != '\\n') is FALSE. We skip putchar.`, stdout: out, stack: clone() });
            }

            stack.pop();
            if (stack.length > 1) stack[stack.length - 1].status = "Active";
            trace.push({ line: 11, explanation: `fx() #${depth} finishes and is popped from the stack.`, stdout: out, stack: clone() });
        }

        sim(1);
        stack[0].status = "Active";
        trace.push({ line: 15, explanation: "All fx() calls have finished! Control returns to main() and the program exits.", stdout: out, stack: clone() });
        return trace;
    }

    // Presets with built-in offline traces so it works immediately without an API key
    const PRESETS = {
        recursion: {
            stdin: "cat",
            code: `#include <stdio.h>

void fx() {
    char a;
    if ((a = getchar()) != '\\n') {
        fx();
    }
    if (a != '\\n') {
        putchar(a);
    }
}

int main(void) {
    fx();
    return 0;
}`,
            offlineTrace: [] // Generated dynamically via buildRecursionTrace()
        },
        loop: {
            stdin: "",
            code: `#include <stdio.h>

int main() {
    int arr[3] = {10, 20, 30};
    int sum = 0;
    for (int i = 0; i < 3; i++) {
        sum += arr[i];
    }
    printf("Sum = %d", sum);
    return 0;
}`,
            offlineTrace: [
                { line: 4, explanation: "Initialize array 'arr' with 3 elements: {10, 20, 30}.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}" } }] },
                { line: 5, explanation: "Initialize variable 'sum' to 0.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "0" } }] },
                { line: 6, explanation: "Start for-loop: initialize 'i' = 0. Condition (0 < 3) is True.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "0", i: "0" } }] },
                { line: 7, explanation: "Add arr[0] (10) to sum. sum becomes 10.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "10", i: "0" } }] },
                { line: 6, explanation: "Increment 'i' to 1. Condition (1 < 3) is True.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "10", i: "1" } }] },
                { line: 7, explanation: "Add arr[1] (20) to sum. sum becomes 30.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "30", i: "1" } }] },
                { line: 6, explanation: "Increment 'i' to 2. Condition (2 < 3) is True.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "30", i: "2" } }] },
                { line: 7, explanation: "Add arr[2] (30) to sum. sum becomes 60.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "60", i: "2" } }] },
                { line: 6, explanation: "Increment 'i' to 3. Condition (3 < 3) is FALSE. Loop ends.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "60", i: "3" } }] },
                { line: 9, explanation: "printf outputs 'Sum = 60' to the terminal.", stdout: "Sum = 60", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "60" } }] },
                { line: 10, explanation: "Program finishes and returns 0.", stdout: "Sum = 60", stack: [{ func: "main()", status: "Active", vars: { arr: "{10, 20, 30}", sum: "60" } }] }
            ]
        },
        factorial: {
            stdin: "",
            code: `#include <stdio.h>

int fact(int n) {
    if (n <= 1) return 1;
    return n * fact(n - 1);
}

int main() {
    int res = fact(3);
    printf("3! = %d", res);
    return 0;
}`,
            offlineTrace: [
                { line: 9, explanation: "main() calls fact(3) to compute 3 factorial.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { res: "?" } }] },
                { line: 3, explanation: "Entered fact(n=3).", stdout: "", stack: [{ func: "main()", status: "Paused", vars: { res: "?" } }, { func: "fact(3)", status: "Active", vars: { n: "3" } }] },
                { line: 4, explanation: "Check (3 <= 1) -> False.", stdout: "", stack: [{ func: "main()", status: "Paused", vars: { res: "?" } }, { func: "fact(3)", status: "Active", vars: { n: "3" } }] },
                { line: 5, explanation: "Needs 3 * fact(2). Pauses fact(3) and calls fact(2).", stdout: "", stack: [{ func: "main()", status: "Paused", vars: { res: "?" } }, { func: "fact(3)", status: "Paused", vars: { n: "3" } }, { func: "fact(2)", status: "Active", vars: { n: "2" } }] },
                { line: 5, explanation: "In fact(2): (2 <= 1) is False. Needs 2 * fact(1). Calls fact(1).", stdout: "", stack: [{ func: "main()", status: "Paused", vars: { res: "?" } }, { func: "fact(3)", status: "Paused", vars: { n: "3" } }, { func: "fact(2)", status: "Paused", vars: { n: "2" } }, { func: "fact(1)", status: "Active", vars: { n: "1" } }] },
                { line: 4, explanation: "In fact(1): (1 <= 1) is TRUE! Returns 1 to fact(2).", stdout: "", stack: [{ func: "main()", status: "Paused", vars: { res: "?" } }, { func: "fact(3)", status: "Paused", vars: { n: "3" } }, { func: "fact(2)", status: "Paused", vars: { n: "2" } }, { func: "fact(1)", status: "Returning 1", vars: { n: "1" } }] },
                { line: 5, explanation: "Back in fact(2): computes 2 * 1 = 2, and returns 2 to fact(3).", stdout: "", stack: [{ func: "main()", status: "Paused", vars: { res: "?" } }, { func: "fact(3)", status: "Paused", vars: { n: "3" } }, { func: "fact(2)", status: "Returning 2", vars: { n: "2" } }] },
                { line: 5, explanation: "Back in fact(3): computes 3 * 2 = 6, and returns 6 to main().", stdout: "", stack: [{ func: "main()", status: "Paused", vars: { res: "?" } }, { func: "fact(3)", status: "Returning 6", vars: { n: "3" } }] },
                { line: 9, explanation: "Back in main(): 'res' is assigned the returned value 6.", stdout: "", stack: [{ func: "main()", status: "Active", vars: { res: "6" } }] },
                { line: 10, explanation: "printf prints '3! = 6' to stdout.", stdout: "3! = 6", stack: [{ func: "main()", status: "Active", vars: { res: "6" } }] },
                { line: 11, explanation: "main() returns 0. Program complete.", stdout: "3! = 6", stack: [{ func: "main()", status: "Active", vars: { res: "6" } }] }
            ]
        }
    };

    let traceSteps = [];
    let currentIdx = 0;
    let playTimer = null;

    function loadPreset() {
        if (playTimer) togglePlay();
        const key = document.getElementById('presetSelect').value;
        const preset = PRESETS[key];
        document.getElementById('codeEditor').value = preset.code;
        document.getElementById('stdinInput').value = preset.stdin;
        renderCodeView(preset.code);
        traceSteps = (key === 'recursion') ? buildRecursionTrace(preset.stdin) : preset.offlineTrace;
        currentIdx = 0;
        renderStep(0);
    }

    function renderCodeView(rawCode) {
        const view = document.getElementById('codeView');
        view.innerHTML = '';
        const lines = rawCode.split('\n');
        lines.forEach((txt, i) => {
            const lineNum = i + 1;
            const div = document.createElement('div');
            div.className = 'code-line';
            div.id = 'exec-line-' + lineNum;
            div.innerHTML = `<span class="line-num">${lineNum}</span><span class="line-text"></span>`;
            div.querySelector('.line-text').textContent = txt;
            view.appendChild(div);
        });
    }

    function renderStep(idx) {
        if (!traceSteps || traceSteps.length === 0) return;
        const step = traceSteps[idx];

        // 1. Highlight Active Code Line
        document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById('exec-line-' + step.line);
        if (activeEl) {
            activeEl.classList.add('active');
            activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // 2. Update Status & Explanation
        document.getElementById('explanationText').textContent = step.explanation;
        document.getElementById('stepCounter').textContent = `Step ${idx + 1} / ${traceSteps.length}`;

        // 3. Render Call Stack & Variables
        const stackBox = document.getElementById('stackBox');
        stackBox.innerHTML = '';
        (step.stack || []).forEach((frame, i) => {
            const isTop = (i === step.stack.length - 1);
            const div = document.createElement('div');
            div.className = 'stack-frame ' + (isTop ? 'active-frame' : '');

            const varsEntries = Object.entries(frame.vars || {});
            const varsHtml = varsEntries.length > 0
                ? varsEntries.map(([k, v]) => `<span class="var-chip"><span class="var-name">${k}</span> = <span class="var-val">${v}</span></span>`).join('')
                : `<span style="font-size:12px; color:#6c7086;">No local variables</span>`;

            div.innerHTML = `
                <div class="frame-header">
                    <span class="frame-func">${frame.func}</span>
                    <span class="frame-status">${frame.status || (isTop ? 'Active' : 'Paused')}</span>
                </div>
                <div class="vars-grid">${varsHtml}</div>
            `;
            stackBox.appendChild(div);
        });

        // 4. Update Terminal Output
        document.getElementById('stdoutBox').textContent = step.stdout || "";

        // 5. Update Controls
        document.getElementById('btnPrev').disabled = (idx === 0);
        document.getElementById('btnNext').disabled = (idx === traceSteps.length - 1);
        document.getElementById('btnPlay').disabled = false;

        if (idx === traceSteps.length - 1 && playTimer) {
            togglePlay();
        }
    }

    async function compileAndVisualize() {
        if (playTimer) togglePlay();
        const code = document.getElementById('codeEditor').value;
        const stdin = document.getElementById('stdinInput').value;
        const apiKey = document.getElementById('apiKey').value.trim();
        const selectedKey = document.getElementById('presetSelect').value;

        renderCodeView(code);

        // If user hasn't modified the preset C code and didn't enter an API key, run the offline trace (with custom stdin!)
        if (!apiKey && code.trim() === PRESETS[selectedKey].code.trim()) {
            traceSteps = (selectedKey === 'recursion') ? buildRecursionTrace(stdin) : PRESETS[selectedKey].offlineTrace;
            currentIdx = 0;
            renderStep(0);
            return;
        }

        if (!apiKey) {
            alert("To compile and trace custom C code right in the browser, please paste a free Gemini API Key in the top bar (or use one of the built-in presets).");
            return;
        }

        // Call Gemini API to act as our C Compiler + GDB Debugger Trace Generator
        const btn = document.getElementById('btnCompile');
        btn.disabled = true;
        btn.textContent = "⏳ Tracing C Execution...";
        document.getElementById('explanationText').textContent = "Compiling and generating line-by-line GDB execution trace...";

        const numberedCode = code.split('\n').map((l, i) => `${i + 1}: ${l}`).join('\n');
        const prompt = `You are an exact C compiler and GDB step-by-step execution tracer.
Simulate the execution of the following C program with the given stdin input (note: stdin ends with a newline '\\n').
Be 100% faithful to C operator precedence, ASCII values, pointers, and recursion.
Limit the trace to at most 40 key execution steps.

C CODE (with line numbers):
${numberedCode}

STDIN INPUT:
${stdin}\\n

Return ONLY a valid JSON array of step objects. Each object MUST have this exact structure:
[
  {
    "line": 12,
    "explanation": "Clear, beginner-friendly explanation of what happens on this line",
    "stdout": "cumulative terminal output printed so far",
    "stack": [
      {
        "func": "main()",
        "status": "Active or Paused",
        "vars": { "varName": "value" }
      }
    ]
  }
]`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            const rawJson = data.candidates[0].content.parts[0].text;
            traceSteps = JSON.parse(rawJson);
            currentIdx = 0;
            renderStep(0);
        } catch (err) {
            document.getElementById('explanationText').textContent = "❌ Error generating trace: " + err.message;
        } finally {
            btn.disabled = false;
            btn.textContent = "⚡ Compile & Visualize";
        }
    }

    function nextStep() {
        if (currentIdx < traceSteps.length - 1) {
            currentIdx++;
            renderStep(currentIdx);
        }
    }

    function prevStep() {
        if (currentIdx > 0) {
            currentIdx--;
            renderStep(currentIdx);
        }
    }

    function togglePlay() {
        const btn = document.getElementById('btnPlay');
        if (playTimer) {
            clearInterval(playTimer);
            playTimer = null;
            btn.textContent = "▶ Play";
        } else {
            if (currentIdx === traceSteps.length - 1) currentIdx = 0;
            btn.textContent = "⏸ Pause";
            playTimer = setInterval(nextStep, 1100);
        }
    }

    window.onload = loadPreset;
</script>
</body>
</html>
